name: Build JAASM

on:
  push:
    branches: [ main, phase-1-steamcmd-bootstrap ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore JAASM.slnx
      - name: Build
        run: dotnet build JAASM.slnx -c Release --no-restore
      - name: Publish
        run: dotnet publish src/JAASM.App/JAASM.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: JAASM-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
